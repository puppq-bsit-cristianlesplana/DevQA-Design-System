<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #e8ecee; padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.card {
  background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(52,152,219,0.12) 100%);
  border-radius: 12px; border: 1px solid #ddd;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  padding: 16px; flex: 1; min-width: 180px;
}
.card-projects {
  background: linear-gradient(135deg, rgba(52,152,219,0.25) 0%, rgba(26,188,156,0.25) 100%);
  border-color: rgba(52,152,219,0.4);
}
.card-about {
  background: linear-gradient(135deg, rgba(155,89,182,0.25) 0%, rgba(233,30,99,0.2) 100%);
  border-color: rgba(155,89,182,0.4);
}
.card-contact {
  background: linear-gradient(135deg, rgba(230,126,34,0.25) 0%, rgba(231,76,60,0.25) 100%);
  border-color: rgba(230,126,34,0.4);
}
.card h4 { font-size: 0.95rem; font-weight: 700; color: #2c3e50; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.card p  { font-size: 0.78rem; color: #555; line-height: 1.4; }
.card .accent { color: #3498db; }
.card .accent-purple { color: #9b59b6; }
.card .accent-orange { color: #e67e22; }
.card-label { font-size: 9px; font-weight: 700; text-transform: uppercase; color: #aaa; letter-spacing: .05em; margin-bottom: 4px; }
</style></head>
<body>
  <div style="display:flex; flex-direction:column; gap:4px; min-width:180px; flex:1;">
    <div class="card-label">Generic Card</div>
    <div class="card">
      <h4><i class="fa fa-code accent"></i> Projects</h4>
      <p>Click to preview your semester projects and achievements.</p>
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap:4px; min-width:180px; flex:1;">
    <div class="card-label">Projects tint</div>
    <div class="card card-projects">
      <h4><i class="fa fa-code accent"></i> Projects</h4>
      <p>Blue → teal tinted preview card variant.</p>
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap:4px; min-width:180px; flex:1;">
    <div class="card-label">About tint</div>
    <div class="card card-about">
      <h4><i class="fa fa-user accent-purple"></i> About Me</h4>
      <p>Purple → pink tinted preview card variant.</p>
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap:4px; min-width:180px; flex:1;">
    <div class="card-label">Contact tint</div>
    <div class="card card-contact">
      <h4><i class="fa fa-envelope accent-orange"></i> Contact</h4>
      <p>Orange → red tinted preview card variant.</p>
    </div>
  </div>
</body></html>
