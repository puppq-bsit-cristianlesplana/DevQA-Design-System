<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f2f0; padding: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.card { flex: 1; min-width: 140px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.card-bg { height: 60px; }
.card-info { background: #fff; padding: 8px 10px; }
.card-name { font-size: 11px; font-weight: 700; color: #333; }
.card-val  { font-size: 9px; color: #999; font-family: monospace; margin-top: 2px; }
.label { font-size: 10px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing:.05em; margin-bottom: 8px; }
</style></head>
<body>
<div class="label">Preview Card Tint Gradients</div>
<div class="row">
  <div class="card">
    <div class="card-bg" style="background:linear-gradient(135deg,rgba(52,152,219,.25),rgba(26,188,156,.25));"></div>
    <div class="card-info"><div class="card-name">Projects</div><div class="card-val">blue → teal</div></div>
  </div>
  <div class="card">
    <div class="card-bg" style="background:linear-gradient(135deg,rgba(155,89,182,.25),rgba(233,30,99,.2));"></div>
    <div class="card-info"><div class="card-name">About Me</div><div class="card-val">purple → pink</div></div>
  </div>
  <div class="card">
    <div class="card-bg" style="background:linear-gradient(135deg,rgba(230,126,34,.25),rgba(231,76,60,.25));"></div>
    <div class="card-info"><div class="card-name">Contact</div><div class="card-val">orange → red</div></div>
  </div>
  <div class="card">
    <div class="card-bg" style="background:linear-gradient(135deg,rgba(52,152,219,.12),rgba(52,152,219,0));"></div>
    <div class="card-info"><div class="card-name">Generic Card</div><div class="card-val">blue → transparent</div></div>
  </div>
  <div class="card">
    <div class="card-bg" style="background:linear-gradient(90deg,rgba(44,62,80,1),rgba(52,152,219,1));"></div>
    <div class="card-info"><div class="card-name">Year Label</div><div class="card-val">navy → blue pill</div></div>
  </div>
</div>
</body></html>
