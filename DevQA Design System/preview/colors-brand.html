<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.12); min-width: 90px; flex: 1; }
.swatch-color { height: 70px; }
.swatch-info { background: #fff; padding: 8px 10px; }
.swatch-name { font-size: 11px; font-weight: 700; color: #333; }
.swatch-hex  { font-size: 10px; color: #888; font-family: monospace; margin-top: 2px; }
.label { font-size: 10px; font-weight: 700; color: #666; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.section { margin-bottom: 16px; }
</style></head>
<body>
<div class="section">
  <div class="label">Brand Primaries</div>
  <div class="swatches">
    <div class="swatch">
      <div class="swatch-color" style="background:#2c3e50;"></div>
      <div class="swatch-info"><div class="swatch-name">Navy</div><div class="swatch-hex">#2c3e50</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#3498db;"></div>
      <div class="swatch-info"><div class="swatch-name">Blue</div><div class="swatch-hex">#3498db</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#2ecc71;"></div>
      <div class="swatch-info"><div class="swatch-name">Green</div><div class="swatch-hex">#2ecc71</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#41c96d;"></div>
      <div class="swatch-info"><div class="swatch-name">Green Alt</div><div class="swatch-hex">#41c96d</div></div>
    </div>
  </div>
</div>
<div class="section">
  <div class="label">Extended Palette (card tints)</div>
  <div class="swatches">
    <div class="swatch">
      <div class="swatch-color" style="background:#1abc9c;"></div>
      <div class="swatch-info"><div class="swatch-name">Teal</div><div class="swatch-hex">#1abc9c</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#9b59b6;"></div>
      <div class="swatch-info"><div class="swatch-name">Purple</div><div class="swatch-hex">#9b59b6</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#e91e63;"></div>
      <div class="swatch-info"><div class="swatch-name">Pink</div><div class="swatch-hex">#e91e63</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#e67e22;"></div>
      <div class="swatch-info"><div class="swatch-name">Orange</div><div class="swatch-hex">#e67e22</div></div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#e74c3c;"></div>
      <div class="swatch-info"><div class="swatch-name">Red</div><div class="swatch-hex">#e74c3c</div></div>
    </div>
  </div>
</div>
</body></html>
