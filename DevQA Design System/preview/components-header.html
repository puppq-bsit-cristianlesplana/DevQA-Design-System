<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #e8ecee; padding: 0; }
.header {
  background: linear-gradient(90deg, rgba(44,62,80,.95) 0%, rgba(52,152,219,.9) 100%);
  padding: 14px 5%;
  display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(5px);
}
.logo { color: #fff; display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 700; cursor: pointer; }
.logo-icon { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
.logo-icon img { width: 40px; height: 40px; object-fit: contain; }
.header-right { display: flex; align-items: center; gap: 12px; }
.theme-btn { background: none; border: none; font-size: 1.1rem; color: #fff; cursor: pointer; }
.search-box input {
  background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25);
  border-radius: 20px; padding: 5px 14px; width: 100px; font-size: 0.85rem;
}
.search-box input::placeholder { color: rgba(255,255,255,0.6); }
.menu-trigger { background: rgba(44,62,80,0.85); color: white; border: none; padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: 700; }
.spacer { height: 10px; background: #e8ecee; }
.header.dark-mode {
  background: linear-gradient(90deg, rgba(15,20,30,.97) 0%, rgba(30,80,130,.95) 100%);
}
.dark-label { font-size: 10px; color: #999; font-weight: 700; text-transform: uppercase; letter-spacing:.05em; padding: 6px 16px; background: #e8ecee; }
</style></head>
<body>
  <div class="dark-label">☀ Light Mode</div>
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><img src="../assets/LOGO.png" alt="DQ"></div>
      CRISTIAN
    </div>
    <div class="header-right">
      <button class="theme-btn"><i class="fa fa-moon"></i></button>
      <div class="search-box"><input type="text" placeholder="Search..."></div>
      <button class="menu-trigger">MENU ☰</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="dark-label">🌙 Dark Mode</div>
  <div class="header dark-mode">
    <div class="logo">
      <div class="logo-icon"><img src="../assets/LOGO.png" alt="DQ"></div>
      CRISTIAN
    </div>
    <div class="header-right">
      <button class="theme-btn"><i class="fa fa-sun"></i></button>
      <div class="search-box"><input type="text" placeholder="Search..."></div>
      <button class="menu-trigger">MENU ☰</button>
    </div>
  </div>
</body></html>
