<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing:.05em; margin-bottom: 2px; }

/* Buttons */
.btn-primary {
  background: #3498db; color: #fff; border: none;
  padding: 10px 22px; border-radius: 8px; font-weight: 700; font-size: 0.92rem;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.btn-send {
  background: linear-gradient(90deg, rgba(230,126,34,.85), rgba(231,76,60,.85));
  color: #fff; border: none; padding: 10px 20px; border-radius: 6px;
  font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.btn-preview {
  background: #3498db; color: #fff; text-decoration: none;
  padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.92rem;
  display: flex; align-items: center; gap: 8px;
}
.btn-menu {
  background: #2c3e50; color: white; border: none;
  padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: 700;
}

/* Inputs */
.input-field {
  width: 240px; padding: 10px 12px; border: 1px solid #ddd;
  border-radius: 8px; background: rgba(255,255,255,0.9); color: #333;
  font-family: inherit; font-size: 0.9rem;
}
.input-search {
  background: rgba(255,255,255,0.15); color: #333; border: 1px solid #ddd;
  border-radius: 20px; padding: 6px 15px; width: 120px;
}
textarea.input-field { height: 60px; resize: none; }
.form-label { font-size: 0.88rem; font-weight: 600; color: #3498db; margin-bottom: 4px; display: block; }
</style></head>
<body>
  <div>
    <div class="label">Buttons</div>
    <div class="row">
      <button class="btn-primary"><i class="fa fa-arrow-right"></i> Go to Page</button>
      <button class="btn-send"><i class="fa fa-paper-plane"></i> Send Message</button>
      <button class="btn-menu">MENU ☰</button>
    </div>
  </div>

  <div>
    <div class="label">Form Inputs</div>
    <div class="row">
      <div>
        <label class="form-label">Email Address</label>
        <input type="email" class="input-field" placeholder="email@example.com">
      </div>
      <div>
        <label class="form-label">Search</label>
        <input type="text" class="input-search" placeholder="Search...">
      </div>
    </div>
  </div>

  <div>
    <div class="label">Textarea</div>
    <div class="row">
      <div>
        <label class="form-label">Your Message</label>
        <textarea class="input-field" placeholder="How can I help you?"></textarea>
      </div>
    </div>
  </div>
</body></html>
