<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: rgba(0,0,0,0.55); padding: 24px; display: flex; align-items: flex-start; justify-content: center; gap: 16px; flex-wrap: wrap; min-height: 100vh; }
.modal-box {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(14px);
  border: 1px solid #ddd;
  border-radius: 16px;
  padding: 24px 20px 20px;
  max-width: 340px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  animation: slideIn 0.25s ease;
  position: relative;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: none; font-size: 1.6rem;
  cursor: pointer; color: #333; opacity: 0.5; line-height: 1;
}
.modal-close:hover { opacity: 1; }
.modal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.subject-tag {
  font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 12px;
  background: linear-gradient(90deg, rgba(52,152,219,0.2), rgba(26,188,156,0.2));
  color: #3498db; border: 1px solid rgba(52,152,219,0.3);
}
.platform-tag {
  font-size: 0.72rem; padding: 3px 10px; border-radius: 12px;
  background: rgba(44,62,80,0.1); color: #333; border: 1px solid #ddd;
}
.modal-title { font-size: 1.15rem; color: #2c3e50; padding-right: 24px; margin-bottom: 10px; }
.modal-hr { border: none; border-top: 1px solid #ddd; margin: 10px 0; }
.modal-img { width: 100%; border-radius: 10px; margin-bottom: 12px; border: 1px solid #ddd; }
.modal-desc { font-size: 0.85rem; line-height: 1.6; color: #444; margin-bottom: 12px; }
.tech-stack { display: flex; gap: 6px; flex-wrap: wrap; }
.tech {
  font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 10px;
  background: linear-gradient(90deg, rgba(155,89,182,0.2), rgba(52,152,219,0.2));
  color: #333; border: 1px solid rgba(155,89,182,0.3);
}
</style></head>
<body>
  <div class="modal-box">
    <button class="modal-close">&times;</button>
    <div class="modal-meta">
      <span class="subject-tag">Comprog 1</span>
      <span class="platform-tag"><i class="fa fa-desktop"></i> Desktop</span>
    </div>
    <div class="modal-title"><i class="fa fa-calendar-check" style="color:#3498db;"></i> POLYCAL v1</div>
    <hr class="modal-hr">
    <img class="modal-img" src="../assets/polycal-mockup.png" alt="POLYCAL">
    <p class="modal-desc">A student calendar desktop app for Polytechnic students to manage schedules, deadlines, and subjects — built with <strong>Python (Tkinter)</strong>.</p>
    <div class="tech-stack">
      <span class="tech">Python</span>
      <span class="tech">Tkinter</span>
    </div>
  </div>
</body></html>
